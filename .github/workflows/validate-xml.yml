name: Validate AMF Schema and Examples

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install xmllint
      run: |
        sudo apt-get update 
        sudo apt-get install -y libxml2-utils

    - name: Validate XML Files
      run: |
        shopt -s globstar
        # Only schema-valid samples are checked. examples/invalid/ holds
        # deliberately-broken AMFs (schema- and/or semantically-invalid) that
        # exercise the validator's rejection paths, so it is excluded here.
        for file in examples/valid/**/*.amf examples/generated/**/*.amf; do
          xmllint --noout --schema schema/acesMetadataFile.xsd "$file"
        done
